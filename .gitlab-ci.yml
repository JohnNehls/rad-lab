# GitLab counterpart of .github/workflows/ruff.yml, python-app.yml and docs.yml.
# Commits arrive via the GitHub -> GitLab mirror (.github/workflows/gitlab-mirror.yml).
# Docs are hosted on GitLab Pages independently of the GitHub Pages deploy; PyPI
# publish stays GitHub-only.

stages: [lint, test, docs]

ruff:
  stage: lint
  image: python:3.12
  script:
    - pip install ruff==0.15.8  # Keep in sync with ruff.yml
    - ruff check .
    - ruff format --diff .

test:
  stage: test
  # Debian-based image rather than the pinned ubuntu-24.04 runner used on GitHub. Figures
  # render from matplotlib's bundled freetype/fonts, so the apps baselines should still match.
  image: python:${PY}
  parallel:
    matrix:
      - PY: ["3.11", "3.12", "3.13"]
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - python -m pip install --upgrade pip
    - pip install ".[dev]"
    - python -m pytest tests/ -v
    - python -m pytest -m apps -v  # Apps regression (stdout + full pixel figure comparison)

.docs-build:
  stage: docs
  image: python:3.11
  script:
    - pip install -e ".[docs]"
    - python docs/mkdocs/make_gallery.py
    # Built to public/ as an artifact (no branch push), so it never touches GitHub's gh-pages
    - mkdocs build --strict -f docs/mkdocs/mkdocs.yml -d "$CI_PROJECT_DIR/public"

docs-check:
  extends: .docs-build
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

pages:
  extends: .docs-build
  rules:
    # Explicit, not $CI_DEFAULT_BRANCH: GitLab makes the first mirrored branch (dev) the default
    - if: $CI_COMMIT_BRANCH == "main"
  artifacts:
    paths: [public]

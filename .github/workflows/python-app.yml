# This workflow will install Python dependencies and run tests across supported Python versions.
# Linting is handled by the Ruff workflow (ruff.yml).
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:

    # Pinned (not ubuntu-latest) so the apps figure baselines compare against a
    # stable rendering environment. Figures render from matplotlib's bundled
    # freetype/fonts (no host LaTeX), so pixels are reproducible run to run.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[dev]"
    - name: Test with pytest
      run: |
        python -m pytest tests/ -v
    - name: Apps regression (stdout + full pixel figure comparison)
      run: |
        python -m pytest -m apps -v
